[package]
name = "jet"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
console = "0.16.6"
dialoguer = { version = "0.12.0", features = ["fuzzy-select"] }
directories = "6.0.0"
indicatif = "0.18.6"
open = "5.4.4"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "gzip", "form", "query", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
textwrap = "0.16.4"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "time", "process", "sync", "signal", "fs"] }
toml = "1.1.8"
url = "2.5.8"

[target."cfg(unix)".dependencies]
libc = "0.2.191"
